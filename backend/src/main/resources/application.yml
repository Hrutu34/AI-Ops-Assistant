spring:
  application:
    name: ai-ops-assistant

server:
  port: ${PORT:8080}

telemetry:
  gdelt:
    enabled: ${GDELT_ENABLED:false}
    query: ${GDELT_QUERY:conflict OR war OR crisis}
    max-records: ${GDELT_MAX_RECORDS:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
